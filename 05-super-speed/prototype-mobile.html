<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Dispatch Mobile Prototype</title>
<style>
:root{
  --bg:#e9e8e3;--app:#f7f6f2;--card:#ffffff;--ink:#1b1b19;--ink-2:#55544f;--muted:#8a8982;--line:rgba(0,0,0,.09);
  --accent:#2a63c7;--accent-bg:#e7effb;--danger:#b4322f;--danger-bg:#fbeaea;--warn:#8a5a06;--warn-bg:#fbf0db;
  --ok:#1d7a4f;--ok-bg:#e3f4ea;--take:#1f9d5c;--frame:#111;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0c0c0b;--app:#151514;--card:#1f1f1d;--ink:#efeee9;--ink-2:#c3c2b7;--muted:#8a8982;--line:rgba(255,255,255,.10);
  --accent:#7aa7f0;--accent-bg:#1d2a40;--danger:#f08b88;--danger-bg:#3a1f1f;--warn:#f1c26b;--warn-bg:#3a2e17;
  --ok:#7fd3a6;--ok-bg:#183326;--take:#2fbf71;--frame:#000;}}
:root[data-theme="dark"]{
  --bg:#0c0c0b;--app:#151514;--card:#1f1f1d;--ink:#efeee9;--ink-2:#c3c2b7;--muted:#8a8982;--line:rgba(255,255,255,.10);
  --accent:#7aa7f0;--accent-bg:#1d2a40;--danger:#f08b88;--danger-bg:#3a1f1f;--warn:#f1c26b;--warn-bg:#3a2e17;
  --ok:#7fd3a6;--ok-bg:#183326;--take:#2fbf71;--frame:#000;}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--ink);font:16px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;display:flex;justify-content:center}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.app{width:100%;max-width:420px;height:100dvh;background:var(--app);display:flex;flex-direction:column;position:relative;overflow:hidden}
@media (min-width:600px){
  body{align-items:center;padding:24px}
  .app{height:min(860px,calc(100dvh - 48px));border-radius:40px;border:10px solid var(--frame)}
}
.status{display:flex;justify-content:space-between;padding:10px 20px 4px;font-size:13px;font-weight:600}
.head{padding:6px 18px 10px}
.head h1{font-size:24px;margin:0;font-weight:700}
.head p{margin:2px 0 0;color:var(--ink-2);font-size:13px}
.screen{flex:1;overflow-y:auto;padding:0 14px 14px;display:flex;flex-direction:column;gap:10px}
.card{background:var(--card);border-radius:18px;padding:14px;border:1px solid var(--line)}
.card h3{margin:0 0 4px;font-size:16px}
.small{font-size:13px;color:var(--ink-2)}
.tag{font-size:11px;font-weight:600;padding:3px 9px;border-radius:99px;white-space:nowrap}
.t-danger{background:var(--danger-bg);color:var(--danger)}.t-warn{background:var(--warn-bg);color:var(--warn)}
.t-ok{background:var(--ok-bg);color:var(--ok)}.t-accent{background:var(--accent-bg);color:var(--accent)}.t-muted{background:var(--app);color:var(--ink-2);border:1px solid var(--line)}
.row{display:flex;justify-content:space-between;align-items:center;gap:10px}
.big{display:flex;gap:10px;margin-top:12px}
.big button{flex:1;min-height:56px;border-radius:16px;font-weight:700;font-size:17px}
.take{background:var(--take);color:#fff}.no{background:var(--app);border:1px solid var(--line)}
.callout{border:2px solid #e8a93a}
.callout.late{border-style:dashed}
.callout.good{border-color:var(--take)}
.bar{height:8px;border-radius:4px;background:var(--app);overflow:hidden;margin-top:10px}
.bar i{display:block;height:100%;background:#e8a93a;transition:width .1s linear}
.count{font-size:28px;font-weight:700;font-variant-numeric:tabular-nums}
.pulse{animation:pulse 1s ease-in-out infinite}
@keyframes pulse{50%{transform:scale(1.015)}}
@media (prefers-reduced-motion: reduce){.pulse{animation:none}.bar i{transition:none}}
.person{width:100%;text-align:left;display:block}
.more{margin-top:10px;padding-top:10px;border-top:1px solid var(--line);font-size:14px}
.more p{margin:6px 0}
.chev{color:var(--muted);font-size:13px}
.days{display:flex;gap:4px;margin-top:8px}
.days span{flex:1;text-align:center;font-size:11px;padding:4px 0;border-radius:6px;background:var(--app);color:var(--muted)}
.days .t{background:var(--ok-bg);color:var(--ok)}.days .m{background:var(--warn-bg);color:var(--warn)}.days .d{background:var(--danger-bg);color:var(--danger)}
.q{display:flex;justify-content:space-between;align-items:center;padding:8px 0;border-bottom:1px solid var(--line);font-size:15px}
.q:last-child{border-bottom:0}
.toast{position:absolute;left:12px;right:12px;top:44px;background:var(--ink);color:var(--app);border-radius:16px;padding:12px 14px;font-size:14px;transform:translateY(-12px);opacity:0;visibility:hidden;transition:transform .3s,opacity .3s,visibility .3s;z-index:5}
.toast.show{transform:none;opacity:1;visibility:visible}
.toast b{display:block;font-size:12px;opacity:.7;font-weight:600;text-transform:uppercase;letter-spacing:.05em}
.demo{border-top:1px solid var(--line);background:var(--card);padding:8px 12px}
.demo-top{display:flex;gap:8px;align-items:center}
.demo-top button{padding:9px 12px;border-radius:12px;font-size:14px;font-weight:600}
.go{background:var(--accent);color:#fff;flex:1}
.ghost{border:1px solid var(--line)}
.go[disabled],.ghost[disabled]{opacity:.4;cursor:not-allowed}
.sheet{display:none;padding-top:8px;font-size:13px}
.sheet.open{display:block}
.seg{display:flex;border:1px solid var(--line);border-radius:12px;overflow:hidden;margin-bottom:8px}
.seg button{flex:1;padding:8px;font-size:13px}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--app)}
.meter{height:8px;border-radius:4px;background:var(--app);border:1px solid var(--line);overflow:hidden;margin:4px 0 6px}
.meter i{display:block;height:100%;background:var(--accent);transition:width .4s}
.log{margin:0;padding-left:16px;color:var(--ink-2);max-height:84px;overflow:auto}
.tabs{display:flex;border-top:1px solid var(--line);background:var(--card);padding-bottom:env(safe-area-inset-bottom)}
.tabs button{flex:1;padding:10px 4px 12px;font-size:12px;color:var(--muted);display:flex;flex-direction:column;align-items:center;gap:2px}
.tabs button[aria-selected="true"]{color:var(--accent);font-weight:600}
.tabs .ic{font-size:20px;line-height:1}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chips button{padding:7px 12px;border-radius:99px;border:1px solid var(--line);background:var(--card);font-size:13px}
.chips button[aria-pressed="true"]{background:var(--ink);color:var(--app);border-color:var(--ink)}
.rrow{display:grid;grid-template-columns:minmax(0,1fr) 64px auto;gap:8px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}
.rrow:last-child{border-bottom:0}
.rrow.off{color:var(--muted)}
.rrow small{display:block;color:var(--muted);font-size:12px}
.mins{font-weight:700;font-variant-numeric:tabular-nums;font-size:15px}
.dbar{height:4px;border-radius:2px;background:var(--app);overflow:hidden;margin-top:3px}
.dbar i{display:block;height:100%;background:var(--accent)}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--danger);margin-left:4px;vertical-align:middle}
</style>
</head>
<body>
<div class="app" id="app">
  <div class="status"><span id="clock">14:02</span><span>5G ▮▮▮</span></div>
  <div class="toast" id="toast" role="status" aria-live="polite"></div>
  <div class="head"><h1 id="title">Rook</h1><p id="subtitle">Meteor Mite · responder</p></div>
  <main class="screen" id="screen"></main>

  <div class="demo">
    <div class="demo-top">
      <button class="go" id="start">▶ Send a callout</button>
      <button class="ghost" id="skip" disabled>Skip to 60s</button>
      <button class="ghost" id="more" aria-expanded="false" aria-controls="sheet">Demo ▾</button>
    </div>
    <div class="sheet" id="sheet">
      <div class="seg" role="group" aria-label="Which rules">
        <button id="m-prop" aria-pressed="true">Proposal</button>
        <button id="m-v42" aria-pressed="false">4.2 today</button>
      </div>
      <div class="row"><span>Mite's score (hidden from users)</span><b id="score">0.50</b></div>
      <div class="meter"><i id="meter" style="width:50%"></i></div>
      <ol class="log" id="log"></ol>
      <div class="row" style="margin-top:8px"><span class="small">Made-up data · time runs 10× fast</span><button class="ghost" id="reset" style="padding:6px 10px;border-radius:10px">Start over</button></div>
    </div>
  </div>

  <nav class="tabs" role="tablist" aria-label="Whose phone">
    <button role="tab" id="tab-mite" aria-selected="true"><span class="ic">📱</span>Meteor Mite's phone</button>
    <button role="tab" id="tab-kip" aria-selected="false"><span class="ic">🧭</span>Kip's phone<span id="kip-dot"></span></button>
    <button role="tab" id="tab-all" aria-selected="false"><span class="ic">📍</span>All responders</button>
  </nav>
</div>

<script>
const $ = id => document.getElementById(id);
const TICK_MS = 100, GALE_AFTER = 30;
let mode = "proposal", tab = "mite", open = { mite: true, gale: false }, timer = null, s, lastKey = "", toastTimer;

function fresh() {
  s = { t: 0, phase: "idle", score: mode === "proposal" ? 0.5 : 0, launchSeen: mode !== "proposal",
        galeAt: null, offered: 3, turned: 1, missed: 1, queue: [], log: [], days: ["m","","d","","m","",""], kipUnread: false };
  s.log.push(mode === "proposal" ? "Launch day: every score reset to 0.50." : "Score at the floor (0.00) after weeks of misses.");
}
const live = () => s.phase === "ringing" || s.phase === "late";
const clock = t => `14:${String(2 + Math.floor(t / 60)).padStart(2, "0")}`;

function score(d, why) {
  s.score = Math.max(0, Math.min(1, +(s.score + d).toFixed(2)));
  s.log.push(`${why} (${d > 0 ? "+" : ""}${d.toFixed(2)} → ${s.score.toFixed(2)})`);
}
function toast(head, msg) {
  const el = $("toast"); el.innerHTML = `<b>${head}</b>${msg}`; el.classList.add("show");
  clearTimeout(toastTimer); toastTimer = setTimeout(() => el.classList.remove("show"), 2600);
}
function kipNews(msg) { s.kipUnread = tab !== "kip"; if (tab === "kip") toast("Rook · Kip", msg); }

function start() {
  if (live()) return;
  s.t = 0; s.phase = "ringing"; s.galeAt = null; s.offered++;
  s.queue = [{ who: "Meteor Mite", note: "Asked", cls: "t-accent" }];
  s.log.push("Callout in Eastgate. Mite is closest, asked first.");
  if (tab === "kip") toast("Rook · Kip", "Eastgate callout: Meteor Mite is being asked.");
  else toast("Rook · Callout", "Eastgate · 9 min away. Tap to answer.");
  clearInterval(timer); timer = setInterval(tick, TICK_MS); render();
}
function askGale() { s.galeAt = s.t; s.queue.push({ who: "The Gale", note: `Asked at ${s.t}s`, cls: "t-accent" }); }
function galeTakes() {
  const g = s.queue.find(q => q.who === "The Gale"); g.note = "Took it"; g.cls = "t-ok";
  if (live()) {
    s.phase = "covered"; s.queue[0].note = "Covered"; s.queue[0].cls = "t-muted";
    s.log.push("The Gale took it. Mite: covered, no change.");
    kipNews("The Gale took the Eastgate callout. Mite's standing is unchanged.");
  } else kipNews("The Gale took the Eastgate callout.");
  stop();
}
function tick() {
  s.t++;
  if (s.t === 60 && s.phase === "ringing") {
    if (mode === "proposal") {
      s.phase = "late"; s.queue[0].note = "Still open"; s.queue[0].cls = "t-warn";
      s.log.push("60s: The Gale asked too. Mite's ping stays open.");
    } else {
      s.phase = "gone"; s.missed++; s.days[6] = "m"; s.queue[0].note = "Missed"; s.queue[0].cls = "t-danger";
      score(-0.12, "60s: ping withdrawn, counted as a no");
    }
    askGale();
  }
  if (s.galeAt !== null && s.t === s.galeAt + GALE_AFTER) galeTakes();
  render();
}
function stop() { clearInterval(timer); timer = null; render(); }
function take() {
  if (!live()) return;
  const late = s.phase === "late";
  s.phase = "taken"; s.days[6] = "t"; s.queue[0].note = late ? "Took it (late)" : "Took it"; s.queue[0].cls = "t-ok";
  const g = s.queue.find(q => q.who === "The Gale"); if (g) { g.note = "Covered"; g.cls = "t-muted"; }
  score(0.08, late ? "Took it after the first minute, still counts" : "Took it");
  kipNews("Meteor Mite took the Eastgate callout.");
  stop();
}
function decline() {
  if (!live()) return;
  s.phase = "declined"; s.turned++; s.days[6] = "d"; s.queue[0].note = "Turned down"; s.queue[0].cls = "t-danger";
  score(-0.12, "Said no"); if (s.galeAt === null) askGale(); render();
}

function miteScreen() {
  const left = Math.max(0, 60 - s.t);
  let h = "";
  if (!s.launchSeen) h += `<div class="card callout good"><h3>Your standing has been reset</h3>
    <div>We changed how missed pings count. You'll start getting callouts again.</div>
    <div class="big"><button class="no" data-act="ok">Got it</button></div></div>`;
  if (s.phase === "ringing") h += `<div class="card callout pulse"><div class="row"><span class="tag t-warn">New callout</span><span class="count" id="left">${left}s</span></div>
    <h3 style="margin-top:8px">Eastgate · 9 min away</h3><div class="small">A man wearing a crown of antlers is lifting parked cars outside the stadium.</div>
    <div class="bar"><i id="barfill" style="width:${left / 60 * 100}%"></i></div>
    <div class="big"><button class="take" data-act="take">Take</button><button class="no" data-act="no">Turn down</button></div></div>`;
  if (s.phase === "late") h += `<div class="card callout late"><span class="tag t-warn">Still open</span>
    <h3 style="margin-top:8px">Someone else is being asked too.</h3><div>Still open: tap to take.</div>
    <div class="small" style="margin-top:4px">Eastgate · 9 min away</div>
    <div class="big"><button class="take" data-act="take">Take</button><button class="no" data-act="no">Turn down</button></div></div>`;
  if (s.phase === "taken") h += `<div class="card callout good"><span class="tag t-ok">You're on it</span><h3 style="margin-top:8px">Eastgate · 9 min away</h3><div class="small">Kip has been told.</div></div>`;
  if (s.phase === "covered") h += `<div class="card"><span class="tag t-muted">Updated quietly</span><h3 style="margin-top:8px">Covered by another responder.</h3><div>This doesn't count against you.</div></div>`;
  if (s.phase === "declined") h += `<div class="card"><span class="tag t-muted">Turned down</span><h3 style="margin-top:8px">You turned this one down.</h3><div class="small">It's gone to the next responder.</div></div>`;
  if (s.phase === "gone") h += `<div class="card"><span class="tag t-muted">60s</span><h3 style="margin-top:8px">This callout is no longer available.</h3></div>`;
  if (s.phase === "idle" && s.launchSeen) h += `<div class="card"><h3>No callouts right now</h3><div class="small">You're available in Eastgate.</div></div>`;
  if (mode === "proposal") h += `<div class="card"><div class="small">This week</div><h3>Offered ${s.offered} callouts <span class="small">(usually 11)</span></h3>
    <div class="small">You turned down ${s.turned} and didn't answer ${s.missed} in time.</div></div>`;
  return h;
}

function kipScreen() {
  const back = s.phase === "taken";
  const daysHtml = s.days.map((x, i) => `<span class="${x}">${["W","T","F","S","S","M","Today"][i]}</span>`).join("");
  const alert = mode === "proposal"
    ? `<p><b>1 ping in 7 days</b> (usual: 11).</p><p><span class="small">Why:</span> 3 of the last 4 pings were answered after the first minute.</p>
       <p><span class="small">What brings them back:</span> their standing was reset on launch day. Each callout they take moves them up. Missing one no longer pushes them down.</p>`
    : `<p><b>No alert today.</b> Kip only notices that Mite's phone has gone quiet, and files a ticket.</p>`;
  let h = `<button class="card person" data-act="mite"><div class="row"><h3>Meteor Mite</h3>
      <span><span class="tag ${back ? "t-ok" : "t-danger"}">${back ? "Back" : "Quiet"}</span> <span class="chev">${open.mite ? "▴" : "▾"}</span></span></div>
      <div class="small">Eastgate · usually 11 pings a week</div>
      ${open.mite ? `<div class="more">${alert}<div class="small" style="margin-top:8px">Last 7 days</div><div class="days">${daysHtml}</div></div>` : ""}</button>
    <button class="card person" data-act="gale"><div class="row"><h3>The Gale</h3><span><span class="tag t-warn">Busy</span> <span class="chev">${open.gale ? "▴" : "▾"}</span></span></div>
      <div class="small">Eastgate · 21 pings this week (usual: 13)</div>
      ${open.gale ? `<div class="more"><p>Not fixed by this change. Needs a separate fairness rule.</p></div>` : ""}</button>`;
  h += `<div class="card"><div class="row"><h3>Live callout · Eastgate</h3><span class="small" id="kip-t">${timer ? s.t + "s" : (s.queue.length ? "finished" : "")}</span></div>
    ${s.queue.length ? s.queue.map((q, i) => `<div class="q"><span>${i + 1}. ${q.who}</span><span class="tag ${q.cls}">${q.note}</span></div>`).join("")
      : `<div class="small">Nothing live. Press "Send a callout".</div>`}</div>`;
  return h;
}

// Every responder, with estimated travel time to the Eastgate callout (made up).
// Travel time, not location: nobody's actual whereabouts are shown.
const RESPONDERS = [
  ["Meteor Mite","Eastgate","Kip",9,true], ["The Gale","Eastgate","Kip",12,true],
  ["Nightwell","Midtown","",14,true], ["Sgt. Bulwark","Foundry Row","",16,true],
  ["Captain Vantage","Hillcrest","",18,true], ["Cindermark","Mill District","",19,true],
  ["Vesper","Old Town","Aunt Dot",21,true], ["Stormwrack","Southport","",22,true],
  ["Farlight","Uptown","Linda Pruitt",24,true], ["Sgt. Falkirk","Kingsbridge","",25,true],
  ["Ironvale","Riverside","",27,false], ["The Longcast","Lakeshore","",29,true],
  ["The Drift","Greenway","",31,false], ["The Undertow","Harborside","Desmond Okafor",33,true],
  ["Corporal Ashgrove","Northfield","",38,true], ["Halfmoon","Westbury","",41,false],
].map(([name, area, handler, mins, available]) => ({ name, area, handler, mins, available }));
const HORIZON = 45;
let sortBy = "distance", availOnly = false;

function allScreen() {
  let list = RESPONDERS.filter(r => !availOnly || r.available);
  list = [...list].sort(sortBy === "name" ? (a, b) => a.name.localeCompare(b.name) : (a, b) => a.mins - b.mins);
  const rows = list.map(r => {
    const q = s.queue.find(x => x.who === r.name);
    const [note, cls] = q ? [q.note, q.cls] : r.available ? ["Available", "t-ok"] : ["Off duty", "t-muted"];
    return `<div class="rrow${r.available ? "" : " off"}"><span>${r.name}<small>${r.area}${r.handler === "Kip" ? " · yours" : ""}</small></span>
      <span><span class="mins">${r.mins} min</span><span class="dbar" aria-hidden="true"><i style="width:${(1 - r.mins / HORIZON) * 100}%"></i></span></span>
      <span class="tag ${cls}">${note}</span></div>`;
  }).join("");
  const free = RESPONDERS.filter(r => r.available).length;
  return `<div class="card"><h3>Eastgate callout · stadium</h3><div class="small">Travel time for every responder · ${free} of ${RESPONDERS.length} available</div></div>
    <div class="chips" role="group" aria-label="Sort and filter">
      <button data-act="sort-distance" aria-pressed="${sortBy === "distance"}">Nearest first</button>
      <button data-act="sort-name" aria-pressed="${sortBy === "name"}">Name</button>
      <button data-act="avail" aria-pressed="${availOnly}">Available only</button>
    </div>
    <div class="card" style="padding:4px 14px">${rows}</div>
    <div class="small">Bar = how close on the routing scale (full at 0 min, empty at ${HORIZON} min). Travel time only, never anyone's location.</div>`;
}

function render() {
  $("clock").textContent = clock(s.t);
  const key = [tab, mode, s.phase, s.launchSeen, s.offered, s.turned, s.missed, open.mite, open.gale, sortBy, availOnly, s.queue.map(q => q.note).join()].join("|");
  if (key !== lastKey) {
    lastKey = key;
    $("screen").innerHTML = tab === "mite" ? miteScreen() : tab === "kip" ? kipScreen() : allScreen();
  } else {
    const l = $("left"), b = $("barfill"), kt = $("kip-t");
    const left = Math.max(0, 60 - s.t);
    if (l) l.textContent = left + "s"; if (b) b.style.width = (left / 60 * 100) + "%";
    if (kt) kt.textContent = timer ? s.t + "s" : "finished";
  }
  $("title").textContent = { mite: "Rook", kip: "My responders", all: "All responders" }[tab];
  $("subtitle").textContent = { mite: "Meteor Mite · responder", kip: "Kip · handler · Eastgate", all: "Kip · dispatch view" }[tab];
  $("tab-mite").setAttribute("aria-selected", tab === "mite");
  $("tab-kip").setAttribute("aria-selected", tab === "kip");
  $("tab-all").setAttribute("aria-selected", tab === "all");
  $("kip-dot").className = s.kipUnread ? "dot" : "";
  $("start").disabled = live();
  $("skip").disabled = !(s.phase === "ringing" && s.t < 60);
  $("score").textContent = s.score.toFixed(2);
  $("meter").style.width = s.score * 100 + "%";
  $("log").innerHTML = s.log.slice(-5).map(l => `<li>${l}</li>`).join("");
}

$("screen").addEventListener("click", e => {
  const b = e.target.closest("[data-act]"); if (!b) return;
  const a = b.dataset.act;
  if (a === "take") take(); else if (a === "no") decline();
