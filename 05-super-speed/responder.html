<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Responder Window</title>
<style>
:root{
  --bg:#e9e8e3;--app:#f7f6f2;--card:#ffffff;--ink:#1b1b19;--ink-2:#55544f;--muted:#8a8982;--line:rgba(0,0,0,.09);
  --accent:#2a63c7;--warn:#8a5a06;--warn-bg:#fbf0db;--ok:#1d7a4f;--ok-bg:#e3f4ea;--take:#1f9d5c;--frame:#111;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0c0c0b;--app:#151514;--card:#1f1f1d;--ink:#efeee9;--ink-2:#c3c2b7;--muted:#8a8982;--line:rgba(255,255,255,.10);
  --accent:#7aa7f0;--warn:#f1c26b;--warn-bg:#3a2e17;--ok:#7fd3a6;--ok-bg:#183326;--take:#2fbf71;--frame:#000;}}
:root[data-theme="dark"]{
  --bg:#0c0c0b;--app:#151514;--card:#1f1f1d;--ink:#efeee9;--ink-2:#c3c2b7;--muted:#8a8982;--line:rgba(255,255,255,.10);
  --accent:#7aa7f0;--warn:#f1c26b;--warn-bg:#3a2e17;--ok:#7fd3a6;--ok-bg:#183326;--take:#2fbf71;--frame:#000;}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--ink);font:16px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;display:flex;justify-content:center}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.app{width:100%;max-width:420px;height:100dvh;background:var(--app);display:flex;flex-direction:column;position:relative;overflow:hidden}
@media (min-width:600px){body{align-items:center;padding:24px}.app{height:min(860px,calc(100dvh - 48px));border-radius:40px;border:10px solid var(--frame)}}
.status{display:flex;justify-content:space-between;padding:10px 20px 4px;font-size:13px;font-weight:600}
.head{padding:6px 18px 10px}
.head h1{font-size:24px;margin:0;font-weight:700}
.head p{margin:2px 0 0;color:var(--ink-2);font-size:13px}
.screen{flex:1;overflow-y:auto;padding:0 14px 14px;display:flex;flex-direction:column;gap:10px}
.screen > *{flex-shrink:0}
.card{background:var(--card);border-radius:18px;padding:14px;border:1px solid var(--line)}
.card h3{margin:0 0 4px;font-size:16px}
.small{font-size:13px;color:var(--ink-2)}
.tag{font-size:11px;font-weight:600;padding:3px 9px;border-radius:99px;white-space:nowrap}
.t-warn{background:var(--warn-bg);color:var(--warn)}.t-ok{background:var(--ok-bg);color:var(--ok)}.t-muted{background:var(--app);color:var(--ink-2);border:1px solid var(--line)}
.row{display:flex;justify-content:space-between;align-items:center;gap:10px}
.big{display:flex;gap:10px;margin-top:12px}
.big button{flex:1;min-height:56px;border-radius:16px;font-weight:700;font-size:17px}
.take{background:var(--take);color:#fff}.no{background:var(--app);border:1px solid var(--line)}
.callout{border:2px solid #e8a93a}.callout.late{border-style:dashed}.callout.good{border-color:var(--take)}
.bar{height:8px;border-radius:4px;background:var(--app);overflow:hidden;margin-top:10px}
.bar i{display:block;height:100%;background:#e8a93a;transition:width .1s linear}
.count{font-size:28px;font-weight:700;font-variant-numeric:tabular-nums}
.pulse{animation:pulse 1s ease-in-out infinite}
@keyframes pulse{50%{transform:scale(1.015)}}
@media (prefers-reduced-motion: reduce){.pulse{animation:none}.bar i{transition:none}}
.toast{position:absolute;left:12px;right:12px;top:44px;background:var(--ink);color:var(--app);border-radius:16px;padding:12px 14px;font-size:14px;transform:translateY(-12px);opacity:0;visibility:hidden;transition:transform .3s,opacity .3s,visibility .3s;z-index:5}
.toast.show{transform:none;opacity:1;visibility:visible}
.toast b{display:block;font-size:12px;opacity:.7;font-weight:600;text-transform:uppercase;letter-spacing:.05em}
.foot{border-top:1px solid var(--line);background:var(--card);padding:10px 16px;font-size:12px;color:var(--muted);display:flex;justify-content:space-between;gap:8px}
.dotc{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--muted);margin-right:6px;vertical-align:middle}
.dotc.on{background:var(--take)}
</style>
</head>
<body>
<div class="app">
  <div class="status"><span id="clock">14:02</span><span>5G ▮▮▮</span></div>
  <div class="toast" id="toast" role="status" aria-live="polite"></div>
  <div class="head"><h1>Rook</h1><p>Meteor Mite · responder · Eastgate</p></div>
  <main class="screen" id="screen" aria-live="polite"></main>
  <div class="foot"><span><span class="dotc" id="dot"></span><span id="conn">Looking for the dispatcher window…</span></span><span>Made-up data</span></div>
</div>

<script>
// Meteor Mite's phone. The dispatcher window (dispatcher.html) runs the callout
// and the rules; this window shows what Mite sees and sends Mite's taps back.
const $ = id => document.getElementById(id);
const STATE_KEY = "rook-proto-state", ACTION_KEY = "rook-proto-action";
let bc = null, st = null, lastKey = "", lastPhase = null, lastAt = 0, toastTimer;
try { bc = new BroadcastChannel("rook-proto"); } catch (e) {}

function send(act) {
  const m = { type: "action", act, n: Math.random() };
  if (window.opener && !window.opener.closed) { try { window.opener.postMessage(m, "*"); } catch (e) {} }
  if (bc) bc.postMessage(m);
  try { localStorage.setItem(ACTION_KEY, JSON.stringify(m)); } catch (e) {}
}

function onState(m) {
  if (!m || m.type !== "state") return;
  lastAt = Date.now();
  if (st && m.s.phase === "ringing" && lastPhase !== "ringing") {
    toast("Rook · Callout", "Eastgate · 9 min away. Tap to answer.");
    try { navigator.vibrate && navigator.vibrate([200, 100, 200]); } catch (e) {}
  }
  lastPhase = m.s.phase;
  st = m;
  render();
}
window.addEventListener("message", e => onState(e.data));
if (bc) bc.onmessage = e => onState(e.data);
window.addEventListener("storage", e => {
  if (e.key === STATE_KEY && e.newValue) { try { onState(JSON.parse(e.newValue)); } catch (err) {} }
});

function toast(head, msg) {
  const el = $("toast"); el.innerHTML = `<b>${head}</b>${msg}`; el.classList.add("show");
  clearTimeout(toastTimer); toastTimer = setTimeout(() => el.classList.remove("show"), 2600);
}

function screenHtml() {
  if (!st) return `<div class="card"><h3>Waiting for the dispatcher</h3>
    <div class="small">Open <b>dispatcher.html</b> and press "📱 Open responder window", or keep both files open in the same browser.</div></div>`;
  const s = st.s, left = Math.max(0, 60 - s.t);
  let h = "";
  if (!s.launchSeen) h += `<div class="card callout good"><h3>Your standing has been reset</h3>
    <div>We changed how missed pings count. You'll start getting callouts again.</div>
    <div class="big"><button class="no" data-act="ok">Got it</button></div></div>`;
  if (s.phase === "ringing") h += `<div class="card callout pulse"><div class="row"><span class="tag t-warn">New callout</span><span class="count" id="left">${left}s</span></div>
    <h3 style="margin-top:8px">Eastgate · 9 min away</h3><div class="small">A man wearing a crown of antlers is lifting parked cars outside the stadium.</div>
    <div class="bar"><i id="barfill" style="width:${left / 60 * 100}%"></i></div>
    <div class="big"><button class="take" data-act="take">Take</button><button class="no" data-act="no">Turn down</button></div></div>`;
  if (s.phase === "late") h += `<div class="card callout late"><span class="tag t-warn">Still open</span>
    <h3 style="margin-top:8px">Someone else is being asked too.</h3><div>Still open: tap to take.</div>
    <div class="small" style="margin-top:4px">Eastgate · 9 min away</div>
    <div class="big"><button class="take" data-act="take">Take</button><button class="no" data-act="no">Turn down</button></div></div>`;
  if (s.phase === "taken") h += `<div class="card callout good"><span class="tag t-ok">You're on it</span><h3 style="margin-top:8px">Eastgate · 9 min away</h3><div class="small">Kip has been told.</div></div>`;
  if (s.phase === "covered") h += `<div class="card"><span class="tag t-muted">Updated quietly</span><h3 style="margin-top:8px">Covered by another responder.</h3><div>This doesn't count against you.</div></div>`;
  if (s.phase === "declined") h += `<div class="card"><span class="tag t-muted">Turned down</span><h3 style="margin-top:8px">You turned this one down.</h3><div class="small">It's gone to the next responder.</div></div>`;
  if (s.phase === "gone") h += `<div class="card"><span class="tag t-muted">60s</span><h3 style="margin-top:8px">This callout is no longer available.</h3></div>`;
  if (s.phase === "idle" && s.launchSeen) h += `<div class="card"><h3>No callouts right now</h3><div class="small">You're available in Eastgate.</div></div>`;
  if (st.mode === "proposal") h += `<div class="card"><div class="small">This week</div><h3>Offered ${s.offered} callouts <span class="small">(usually 11)</span></h3>
    <div class="small">You turned down ${s.turned} and didn't answer ${s.missed} in time.</div></div>`;
  return h;
}

function render() {
  const s = st && st.s;
  $("clock").textContent = s ? `14:${String(2 + Math.floor(s.t / 60)).padStart(2, "0")}` : "14:02";
  const key = st ? [st.mode, s.phase, s.launchSeen, s.offered, s.turned, s.missed].join("|") : "none";
  if (key !== lastKey) { lastKey = key; $("screen").innerHTML = screenHtml(); }
  else if (s && s.phase === "ringing") {
    const left = Math.max(0, 60 - s.t), l = $("left"), b = $("barfill");
    if (l) l.textContent = left + "s"; if (b) b.style.width = (left / 60 * 100) + "%";
  }
}

function renderConn() {
  const on = Date.now() - lastAt < 4000;
  $("dot").className = "dotc" + (on ? " on" : "");
  $("conn").textContent = on ? "Connected to Kip's console" : "Looking for the dispatcher window…";
}

$("screen").addEventListener("click", e => {
  const b = e.target.closest("[data-act]"); if (b) send(b.dataset.act);
});

// Pick up the latest state if the dispatcher is already running, then keep saying hello.
try { const saved = localStorage.getItem(STATE_KEY); if (saved) { st = JSON.parse(saved); lastPhase = st.s.phase; } } catch (e) {}
// "?demo" shows the same frozen moment as dispatcher.html?demo, for screenshots.
if (location.search.includes("demo")) {
  st = { type: "state", mode: "proposal", running: true, at: Date.now(),
         s: { t: 61, phase: "late", launchSeen: true, offered: 4, turned: 1, missed: 1 } };
  lastAt = Date.now();
  document.documentElement.setAttribute("data-theme", "light");
}
render(); send("hello");
setInterval(() => { send("hello"); renderConn(); }, 2000);
renderConn();
</script>
</body>
</html>
